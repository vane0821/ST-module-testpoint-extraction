module_st_testpoint_file:
  module: "MU"
  testpoints:
    - tp_id: "TS_REG_RW_001"
      lifecycle_status: "complete"
      verification_goal: "覆盖 DATAIN_TASK 和 STREAM_NUM 的 RW 字段访问属性。"
      verification_scenario: "访问 Master 对 DATAIN_TASK 和 STREAM_NUM 的可写 bit 执行 0/1 写入，并读取对应字段。"
      expected_result: "每个可写 bit 支持写入 0 和 1；读回值与写入值一致。"
      coverage_strategy:
        testcase: "reg_rw_bit_toggle_test"
      missing_information: []
      completion_criteria: []
    - tp_id: "TS_REG_RO_002"
      lifecycle_status: "complete"
      verification_goal: "覆盖 TASK_INIT_FINISH 的 RO 字段访问属性。"
      verification_scenario: "在输入资料定义的 TASK_INIT_FINISH=0（任务未完成）和 TASK_INIT_FINISH=1（任务完成）状态下读取该字段。"
      expected_result: "任务未完成状态读回 0，任务完成状态读回 1；可读值及状态条件均来自输入资料定义。"
      coverage_strategy:
        testcase: "reg_ro_task_init_finish_read_test"
      missing_information: []
      completion_criteria: []
    - tp_id: "TS_REG_RESET_003"
      lifecycle_status: "complete"
      verification_goal: "覆盖 DATAIN_TASK、STREAM_NUM 与 TASK_INIT_FINISH 的字段 reset 属性。"
      verification_scenario: "施加输入资料定义的 reset，并读取上述字段。"
      expected_result: "各字段读回其输入资料定义的 reset value。"
      coverage_strategy:
        testcase: "reg_reset_value_test"
      missing_information: []
      completion_criteria: []
    - tp_id: "VFMV_S_F_DYN_FS1_RANGE_001"
      lifecycle_status: "complete"
      parameter: ["fs1"]
      parameter_type: "reg"
      verification_goal: "覆盖 VFMV_S_F 的 fs1 在 SRF_RD_P1_IDX 定义编码空间中的寄存器索引范围。"
      verification_scenario: "向 VFMV_S_F 提交 fs1 覆盖 SRF_RD_P1_IDX 定义 bit range 的编码；在 SRF_RD_P1_IDX 输入处采样。未扫描字段取合法基线值。"
      expected_result: "定义 bit range 内的所有编码均参与扫描；实际有效位、保留位和非法处理方式按照输入规格定义。"
      coverage_strategy:
        coverage_space: "range"
        coverage_target: "SRF_RD_P1_IDX 的定义 bit range"
        bins:
          - name: "fs1_defined_range"
            values: "定义 bit range 的覆盖集合"
      missing_information: []
      completion_criteria: []
    - tp_id: "MU_CFG_CTRL_MODE_001"
      lifecycle_status: "draft"
      verification_goal: "覆盖 CTRL.mode 合法配置空间。"
      verification_scenario: "对 CTRL.mode 写入 normal、debug、perf。"
      expected_result: "按输入规格生效。"
      coverage_strategy: null
      missing_information: ["CTRL.mode 到 HDL signal 的映射", "有效采样事件"]
      completion_criteria: ["提供 HDL 映射、采样事件和 covergroup 名称后转为 complete"]
  blocked_items:
    - category: "Debug 能力 TP"
      source: "MU"
      blocking_reason: "未提供 debug 命令和状态定义，无法定义验证场景。"
      required_input: ["debug spec"]
  missing_input_report: []
  completeness_review:
    note: "只审查既有 TP inventory，不生成新 TP。"
    categories:
      - {category: "配置空间 TP", status: "draft", existing_tp_ids: ["MU_CFG_CTRL_MODE_001"], finding: "缺 HDL 映射和采样事件。"}
      - {category: "动态输入参数 TP", status: "covered", existing_tp_ids: ["VFMV_S_F_DYN_FS1_RANGE_001"], finding: "已覆盖 fs1 定义编码范围。"}
