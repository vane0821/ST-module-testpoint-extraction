type: object
required: [module_st_testpoint_file]
properties:
  module_st_testpoint_file:
    type: object
    required: [module, testpoints, blocked_items, missing_input_report, completeness_review]
    properties:
      module: {type: string}
      testpoints:
        type: array
        items:
          type: object
          required: [tp_id, lifecycle_status, verification_goal, verification_scenario, expected_result]
          properties:
            tp_id: {type: string}
            lifecycle_status: {type: string, enum: [complete, draft]}
            verification_goal: {type: string}
            parameter: {type: [array, 'null']}
            parameter_type: {type: [string, 'null']}
            verification_scenario: {type: string}
            expected_result: {type: string}
            coverage_strategy:
              type: [object, 'null']
              properties:
                testcase: {type: [string, 'null']}
                covergroup: {type: [string, 'null']}
                assertion: {type: [string, 'null']}
                coverage_space: {type: [string, 'null']}
                coverage_target: {type: [string, 'null']}
                bins: {type: [array, 'null']}
                illegal_bins: {type: [array, 'null']}
                ignore_bins: {type: [array, 'null']}
            missing_information: {type: array}
            completion_criteria: {type: array}
      blocked_items: {type: array}
      missing_input_report: {type: array}
      completeness_review: {type: object, description: '只检查 inventory，不触发 TP 生成。'}
