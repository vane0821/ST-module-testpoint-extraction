type: object
required: [testpoints]
properties:
  testpoints:
    type: array
    items:
      type: object
      required: [tp_id, lifecycle_status, verification_goal, verification_scenario, expected_result, coverage_strategy]
      properties:
        tp_id: {type: string}
        lifecycle_status: {type: string, enum: [complete, draft, blocked]}
        verification_goal: {type: [string, 'null']}
        parameter: {type: [array, 'null']}
        parameter_type: {type: [string, 'null']}
        config_object: {type: [string, 'null']}
        field: {type: [string, 'null']}
        debug_capability: {type: [string, 'null']}
        verification_scenario: {type: [string, 'null']}
        expected_result: {type: [string, 'null']}
        coverage_strategy:
          type: [object, 'null']
          properties:
            testcase: {type: [string, 'null']}
            covergroup: {type: [string, 'null']}
            assertion: {type: [string, 'null']}
            coverage_space: {type: [string, 'null']}
            coverage_target: {type: [string, 'null']}
            bins: {type: [array, 'null']}
            illegal_bins: {type: [array, 'null']}
            ignore_bins: {type: [array, 'null']}
        coverage_strategy_mapping: {type: [string, 'null']}
